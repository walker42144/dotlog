<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>番茄联动 · 只读观察</title>
<style>
body{margin:0;background:#f6f4ef;color:#29342e;font:16px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:900px;margin:50px auto;padding:0 24px}h1{font-size:28px;margin:0}p{color:#68736b}header{margin-bottom:28px}.card{padding:28px;background:white;border:1px solid #e4e6df;border-radius:18px;margin:16px 0}.status{font-size:14px;color:#66766c}.title{font-size:30px;font-weight:600;margin:8px 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.value{font-size:21px}small{color:#778078;display:block}ul{padding:0;list-style:none}li{padding:9px 0;border-bottom:1px solid #eee;font-size:14px}code{font-size:12px;overflow-wrap:anywhere}#error{color:#a14c33}details{margin-top:20px}button{border:1px solid #d8dfd7;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{margin-top:24px}}
</style>
<main><header><small>DOTLOG · 番茄联动验证</small><h1>先看见，再联动。</h1><p>读取官方番茄 ToDo 当前状态。这个面板不会开始、暂停或结束专注，也不会写入 DotLog。</p></header>
<section class="card"><div id="connection" class="status">正在连接…</div><div id="title" class="title">—</div><div id="error"></div><div class="grid"><div><small>当前状态</small><div id="state" class="value">未知</div></div><div><small>番茄显示时长</small><div id="time" class="value">—</div></div><div><small>最近读取</small><div id="updated" class="value">—</div></div></div><details><summary>诊断信息</summary><small>会话标识仅用于验证，尚未确认所有暂停／恢复情形下的稳定性。</small><code id="diagnostics"></code></details></section>
<section class="card"><h2>观察到的变化</h2><p>断连会显示“未知”，不会被当成专注结束。重连只建立新基线。记录仅保存在观察器内存，停止后清除。</p><button id="export">导出本次观察</button> <button id="stop">停止观察</button><ul id="events"></ul></section>
<p>请在番茄 ToDo 中正常操作，再检查这里的任务名、状态和变化是否对应。此阶段不自动生成打点记录。</p></main><script src="/observer.js"></script></html>
